version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: signconnect-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./signconnect.db
      - SECRET_KEY=signconnect-ai-production-key-docker-2026
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - ./backend/app/services/ai/models:/app/backend/app/services/ai/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signconnect-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    depends_on:
      - backend
    restart: unless-stopped

